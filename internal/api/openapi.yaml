            application/json:
              schema: { $ref: '#/components/schemas/TodayResponse' }

  # ---- courses ----
  /api/v1/courses:
    get:
      tags: [courses]
      summary: List courses owned by the current user.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    post:
      tags: [courses]
      summary: Create a course from an intent.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                intent_md: { type: string }
      responses: { '201': { description: created } }

  /api/v1/courses/{id}:
    get:
      tags: [courses]
      summary: Full course tree (modules + lessons + quizzes + progress).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    delete:
      tags: [courses]
      summary: Delete a course (cascades to modules/lessons/quizzes).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '204': { description: deleted } }

  /api/v1/courses/{id}/approve:
    post:
      tags: [courses]
      summary: Approve the tutor's curriculum (review → active).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '422': { description: invalid_transition }

  /api/v1/courses/{id}/request-changes:
    post:
      tags: [courses]
      summary: Send the curriculum back to draft for revision.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '422': { description: invalid_transition }

  # Phase 27.6: owner-side curriculum swap (same body as the
  # agent-side PUT /agent/courses/{id}/curriculum; the service
  # retires the generator task when present so a sleeping tutor
  # cannot overwrite manual work).
  /api/v1/courses/{id}/curriculum:
    put:
      tags: [courses]
      summary: Atomic curriculum swap — modules + lessons + quizzes in one tx.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '422': { description: invalid_transition }

  # Phase 32.5: course activity feed. Newest-first; default limit 50,
  # ?limit=N (max 500). Read-only mirror of course_activity rows.
  /api/v1/courses/{id}/activity:
    get:
      tags: [courses]
      summary: Course activity feed (audit who did what).
      security: [{ bearerAuth-cookie: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 500 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  course_id: { type: string }
                  limit: { type: integer }
                  count: { type: integer }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/CourseActivity' }
        '503': { description: course activity not wired }

  # Phase 30.13: granular structure edits with stable IDs. Unlike the
  # curriculum swap these never delete+reinsert rows, so lesson status
  # (student progress) and task links survive. Allowed on
  # draft/review/active; done/archived courses are frozen (422).
  /api/v1/courses/{id}/modules:
    post:
      tags: [courses]
      summary: Append a module to the course (owner-side, Phase 30.13).
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        '201': { description: created }
        '400': { description: invalid_input }
        '404': { description: not_found }
        '422': { description: invalid_transition (course done/archived) }

  /api/v1/courses/{id}/structure:
    put:
      tags: [courses]
      summary: Drag-and-drop reorder — module order + lesson order per module (Phase 30.13).
      description: |
        IDs-only payload; must name every module and every lesson of
        the course exactly once (400 otherwise, nothing written).
        Lessons may move across modules. Positions are rewritten
        1..n in payload order. Returns the refreshed course tree.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modules]
              properties:
                modules:
                  type: array
                  items:
                    type: object
                    required: [module_id, lesson_ids]
                    properties:
                      module_id: { type: string }
                      lesson_ids: { type: array, items: { type: string } }
      responses:
        '200': { description: ok (course tree) }
        '400': { description: invalid_input (unknown/duplicate/missing ids) }
        '404': { description: not_found }
        '422': { description: invalid_transition (course done/archived) }

  /api/v1/modules/{id}:
    patch:
      tags: [courses]
      summary: Rename a module / edit its description in place (Phase 30.13).
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        '200': { description: ok }
        '400': { description: invalid_input }
        '404': { description: not_found }
        '422': { description: invalid_transition (course done/archived) }
    delete:
      tags: [courses]
      summary: Delete a module; lessons and quizzes cascade (progress of those lessons is dropped).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '204': { description: deleted }
        '404': { description: not_found }
        '422': { description: invalid_transition (course done/archived) }

  /api/v1/modules/{id}/lessons:
    post:
      tags: [courses]
      summary: Append a lesson to the module; the lesson is born locked (Phase 30.13).
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
      responses:
        '201': { description: created }
        '400': { description: invalid_input }
        '404': { description: not_found }
        '422': { description: invalid_transition (course done/archived) }

  /api/v1/lessons/{id}:
    patch:
      tags: [courses]
      summary: Rename a lesson in place; status/content/task link preserved (Phase 30.13).
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
      responses:
        '200': { description: ok }
        '400': { description: invalid_input }
        '404': { description: not_found }
        '422': { description: invalid_transition (course done/archived) }
    delete:
      tags: [courses]
      summary: Delete a lesson; its quizzes cascade.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '204': { description: deleted }
        '404': { description: not_found }
        '422': { description: invalid_transition (course done/archived) }

  /api/v1/quizzes/{qid}:
    patch:
      tags: [courses]
      summary: Edit a quiz's question/expected answer/kind in place (Phase 30.13). Empty kind = exact.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_md]
              properties:
                question_md: { type: string }
                expected_md: { type: string }
                kind: { type: string, enum: [open, exact] }
      responses:
        '200': { description: ok }
        '400': { description: invalid_input }
        '404': { description: not_found }
        '422': { description: invalid_transition (course done/archived) }
    delete:
      tags: [courses]
      summary: Delete a quiz.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '204': { description: deleted }
        '404': { description: not_found }
        '422': { description: invalid_transition (course done/archived) }

  # Phase 27.6: owner-side content edit for active courses. The
  # agent-only PUT /agent/lessons/{id}/content still owns the
  # locked → open transition.
  /api/v1/lessons/{id}/content:
    put:
      tags: [courses]
      summary: Update a lesson's content_md (owner edit, active courses).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '404': { description: lesson not found }

  # Phase 27.6: closes the Phase 18.6 debt — owners can add a single
  # quiz to an existing lesson without swapping the whole tree.
  /api/v1/lessons/{id}/quizzes:
    post:
      tags: [courses]
      summary: Append a quiz to a lesson (owner-side). Position 0 = append at end.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '201': { description: created }
        '400': { description: invalid_input }

  /api/v1/lessons/{id}/complete:
    post:
      tags: [courses]
      summary: Mark a lesson done (unlocks the next one).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '422': { description: lesson_not_open }

  /api/v1/lessons/{id}/quizzes/{qid}/answer:
    post:
      tags: [courses]
      summary: Submit a quiz answer (Phase 27.4).
      description: |
        Graded server-side for `exact` quizzes (normalised string
        compare). For `open` quizzes the service spawns a review
        task on the tutor agent and returns its id; the tutor
        accepts/rejects via the standard agent flow.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  correct: { type: boolean }
                  feedback_md: { type: string }
                  review_task_id: { type: string }
        '404': { description: quiz not found }

  # ---- reports ----
  /api/v1/reports/time:
    get:
      tags: [calendar]
      summary: Aggregated time report (by task / by day).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  # ---- wiki + search ----
  /api/v1/pages:
    get:
      tags: [wiki]
      summary: List wiki pages (flat list).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    post:
      tags: [wiki]
      summary: Create or upsert a page.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '201': { description: created } }

  /api/v1/pages/{slug}:
    get:
      tags: [wiki]
      summary: Get a wiki page.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    put:
      tags: [wiki]
      summary: Upsert a wiki page.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    delete:
      tags: [wiki]
      summary: Delete a wiki page.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '204': { description: deleted } }

  /api/v1/pages/{slug}/backlinks:
    get:
      tags: [wiki]
      summary: List pages that link to this one.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/pages/{slug}/move:
    patch:
      tags: [wiki]
      summary: Move a page under a new parent (reparent).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/search:
    get:
      tags: [wiki]
      summary: FTS5 search across tasks/pages/comments.
      security: [{ bearerAuth-cookie: [] }]
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
      responses: { '200': { description: ok } }

  # ---- notifications ----
  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: List in-app notifications for the current user.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Mark a notification as read.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/notifications/subscriptions:
    get:
      tags: [notifications]
      summary: List bot subscriptions.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    post:
      tags: [notifications]
      summary: Create a bot subscription.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '201': { description: created } }

  /api/v1/bots/telegram/bind:
    post:
      tags: [notifications, bots]
      summary: Bind a Telegram chat to the current user (Phase 22.3 follow-up).
      description: |
        Resolves the one-shot onboarding code the bot issued on
        `/start` into a chat id and creates a default subscription
        with the standard event set (task.review_needed,
        task.assigned_to_me, mention.created, task.commented).
        Codes are 6 hex chars, expire after 10 minutes, and are
        consumed atomically — a double-click from the UI returns
        404 the second time.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: '6-char hex from /start reply' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  chat_id: { type: integer }
                  username: { type: string }
                  subscription_id: { type: string }
        '400': { description: invalid_json / missing_code }
        '404': { description: code_unknown }
        '410': { description: code_expired }
        '503': { description: telegram_bot_not_running }

  /api/v1/bots/test:
    post:
      tags: [notifications, bots]
      summary: Test send — deliver a one-off message through any configured bot (Phase 10 subphase).
      description: |
        Independent of the subscription store. The operator picks a
        bot type and target address, and the server delivers a fixed
        test message ("Orenda test message") through that bot. Use
        this to verify credentials and routing in Settings → Bots
        before binding a real subscription.

        `console` is intentionally excluded from the UI bot type
        list — it writes to server stderr and has no user-facing
        signal, so a "test send" through it would look like a silent
        failure. The backend refuses `console` with a 400.

        The handler does a per-bot target pre-check (webhook must
        start with `http(s)://`, email must contain `@` and `.`,
        telegram/vk must be numeric) so the most common typo is
        rejected before a real network round-trip.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bot_type, target_address]
              properties:
                bot_type: { type: string, enum: [webhook, email, telegram, vk] }
                target_address: { type: string, description: 'bot-specific target (chat id, email, URL, peer id)' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  bot_type: { type: string }
                  target: { type: string }
                  sentinel: { type: string, description: 'human-readable marker the recipient should see' }
                  sent_at: { type: string, format: date-time }
        '400':
          description: |
            invalid_json / invalid_input / unknown_bot_type /
            per-bot target pre-check (e.g. webhook_target_must_be_http_url).
        '502':
          description: send_failed — transport-level error after the registry hit.
        '503':
          description: bot_not_running — bot not registered in the live registry.

  /api/v1/notifications/subscriptions/{id}:
    delete:
      tags: [notifications]
      summary: Delete a subscription.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '204': { description: deleted } }

  # ---- sync ----
  /api/v1/sync:
    post:
      tags: [sync]
      summary: Offline sync — batch of operations, idempotent via client_id.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  items:
                    type: object
                    required: [op, target, payload, client_id, created_at]
                    properties:
                      op: { type: string }
                      target: { type: string }
                      payload: { type: object, additionalProperties: true }
                      client_id: { type: string }
                      created_at: { type: string, format: date-time }
      responses: { '200': { description: ok } }

  # ---- backups ----
  /api/v1/backups/settings:
    get:
      tags: [backups]
      summary: Read backup settings (merged: DB overrides win over in-memory cfg).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  remote_url: { type: string }
                  has_auth: { type: boolean }
                  source_hint: { type: string, description: "ui_override_restart_to_apply when DB overrides in-memory cfg" }
    # Phase 28.1 polish.1 — pre-28.1 returned 501. Now persists
    # to the backup_settings table. The running *backup.Service is
    # wired from cfg at startup; the operator must restart to pick
    # up the new remote URL.
    put:
      tags: [backups]
      summary: Update backup settings (persists to backup_settings table; restart required).
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                remote_url: { type: string, description: "git remote URL (http, https, ssh, git)" }
                remote_auth: { type: string, description: "token or auth string (never returned in GET)" }
      responses:
        '200':
          description: persisted; body mirrors the GET response
        '400':
          description: invalid URL or enabled=true without remote_url
        '503':
          description: backup_settings repository not configured

  /api/v1/backups/test:
    post:
      tags: [backups]
      summary: Test the git push.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/backups/snapshot:
    post:
      tags: [backups]
      summary: Trigger a snapshot now.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/backups/snapshots:
    get:
      tags: [backups]
      summary: List snapshots.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
  /api/v1/backups/status:
    get:
      tags: [backups]
      summary: 'Phase 30.9: read-only backup status (snapshot count + latest path/size + timestamp).'
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/backups/restore:
    post:
      tags: [backups]
      summary: Restore from snapshot (server must be stopped; returns CLI hint otherwise).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '409': { description: server_running (returns hint) }

  /api/v1/backups/log:
    get:
      tags: [backups]
      summary: Recent backup log entries.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  # ---- maintenance mode (Phase 22.3) ----
  #
  # The toggle endpoints are NOT gated by the maintenance middleware,
  # so the operator can always flip the flag from inside maintenance
  # (the only escape hatch).
  /api/v1/maintenance:
    get:
      tags: [meta]
      summary: Read the current maintenance flag.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  maintenance: { type: boolean }
  /api/v1/maintenance/on:
    post:
      tags: [meta]
      summary: Enter maintenance mode (writes blocked; WS drained on restore).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  maintenance: { type: boolean }
                  was_already: { type: boolean }
  /api/v1/maintenance/off:
    post:
      tags: [meta]
      summary: Exit maintenance mode (writes resume).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  maintenance: { type: boolean }
                  was_already: { type: boolean }

  # ---- agent (bearer) ----
  /api/v1/agent/me:
    get:
      tags: [agent]
      summary: Confirm the bearer token; return agent profile.
      security: [{ bearerAuth-agent: [] }]
      responses:
        '200': { description: ok }
        '401': { description: invalid_token }

  /api/v1/agent/heartbeat:
    post:
      tags: [agent]
      summary: Refresh last_seen_at.
      security: [{ bearerAuth-agent: [] }]
      responses: { '200': { description: ok } }

  /api/v1/agent/tasks:
    get:
      tags: [agent]
      summary: List claimable tasks (?ready=true filters blocked / claimed).
      security: [{ bearerAuth-agent: [] }]
      parameters:
        - in: query
          name: ready
          schema: { type: boolean }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
      responses: { '200': { description: ok } }
    # Phase 33.1: agent proposes a NEW task. Lands as status=backlog +
    # awaiting=human, so it appears in the existing review queue
    # (awaiting='human' OR status='review') for human triage.
    # Accept = kanban-move to todo (clears awaiting via Service.Move);
    # dismiss = DELETE /api/v1/tasks/{id}. Activity row task.created is
    # written with actor_type=agent; a task.created event is published
    # on the WS topic `tasks`.
    post:
      tags: [agent]
      summary: Propose a new task (status=backlog, awaiting=human — human triages from the review queue).
      security: [{ bearerAuth-agent: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, title, description_md]
              properties:
                project_id: { type: string }
                title: { type: string }
                description_md: { type: string }
                priority: { type: string, enum: [low, medium, high, urgent] }
                blocked_by: { type: array, items: { type: string } }
                parent_task_id: { type: string }
      responses:
        '201': { description: created (backlog, awaiting=human) }
        '400': { description: invalid_json / invalid_input (missing project_id, title or description_md) }
        '401': { description: missing or invalid agent token }
        '404': { description: not_found (unknown project / parent_task_id / blocked_by id) }
        '422': { description: invalid_dependency (self/cycle/duplicate in blocked_by) }

  /api/v1/agent/tasks/{id}/claim:
    post:
      tags: [agent]
      summary: Atomic claim (409 lock_taken / 422 task_blocked).
      security: [{ bearerAuth-agent: [] }]
      responses:
        '200': { description: ok }
        '409':
          description: lock_taken — Phase 15: response body includes holder_agent_id, holder_agent_name, and claimed_at so the agent can see who's holding the lock and reach out.
        '422': { description: task_blocked + unfinished_blockers }

  /api/v1/agent/tasks/{id}/release:
    post:
      tags: [agent]
      summary: Release a claim.
      security: [{ bearerAuth-agent: [] }]
      responses: { '200': { description: ok } }

  /api/v1/agent/tasks/{id}/submit:
    post:
      tags: [agent]
      summary: Mark ready for human review.
      security: [{ bearerAuth-agent: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses: { '200': { description: ok } }

  /api/v1/agent/tasks/{id}/context:
    get:
      tags: [agent]
      summary: Full snapshot for resume.
      description: |
        Phase 15: the response now includes `blocked_by` (list of
        unresolved blocker task ids) and `lock_holder` (agent_id,
        agent_name, acquired_at) when applicable. Both fields are
        omitted when there are no open blockers / no active lock —
        same shape as the user-facing /api/v1/tasks/{id}/context.
      security: [{ bearerAuth-agent: [] }]
      responses: { '200': { description: ok } }

  # Phase 27.11: agent-namespace comment. Mirrors the user-cookie
  # /api/v1/tasks/{id}/comments POST but writes the comment as
  # author_type=agent with the agent's id. Pre-27.11 the agent CLI
  # posted to the user-cookie route which 401'd under RequireUser.
  /api/v1/agent/tasks/{id}/comments:
    post:
      tags: [agent]
      summary: Add a comment authored by the agent (author_type=agent).
      security: [{ bearerAuth-agent: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body_md]
              properties:
                body_md: { type: string }
      responses:
        '201': { description: created }
        '401': { description: missing or invalid agent token }

  # Phase 27.11: agent-namespace long-poll. Mirrors the user-cookie
  # /api/v1/events/await POST but subscribes the WS hub under the
  # agent's id (the user-side handler reads Identity.UserID, the
  # agent handler reads Identity.AgentID). Pre-27.11 the agent CLI
  # posted to the user-cookie route which 401'd under RequireUser.
  /api/v1/agent/events/await:
    post:
      tags: [agent]
      summary: Long-poll for the next event scoped to the agent's id.
      security: [{ bearerAuth-agent: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                topic: { type: string }
                user_id: { type: string, description: "Override the filter id (default = agent's id)." }
                timeout_s: { type: integer, default: 30, maximum: 60 }
      responses:
        '200': { description: ok }
        '204': { description: timeout }
        '401': { description: missing or invalid agent token }

  /api/v1/agent/courses:
    get:
      tags: [agent, courses]
      summary: List courses (tutor's view; ?status=active enriches with progress).
      description: |
        Optional ?status= filter. When status=active the row carries
        a progress sub-object (lessons_total, lessons_done, open_lessons)
        so the planner has everything it needs in one round-trip.
      security: [{ bearerAuth-agent: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [draft, review, active, done, archived] }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Course'
                        - type: object
                          properties:
                            progress:
                              $ref: '#/components/schemas/ActiveCourseProgress'
    post:
      tags: [agent, courses]
      summary: Create a draft course (Phase 29.4) — "agent, build me a course on X".
      description: |
        The course is owned by the first non-system user
        (single-owner install). The generator task is NOT spawned —
        the calling agent is the generator (SkipGenerator is
        forced). Follow with PUT curriculum, materialize the
        lessons, then POST activate; no human click is required.
      security: [{ bearerAuth-agent: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                intent_md: { type: string }
      responses:
        '201': { description: created (draft course) }
        '400': { description: missing_title | invalid_json }
        '503': { description: owner_not_configured (no human user yet) }

  # Phase 29.5: agent-side activation. Shares the approve path with
  # POST /api/v1/courses/{id}/approve (review → active, first
  # lesson unlocked). The human-approve gate in the UI is
  # unchanged; this endpoint removes the mandatory click from the
  # "agent builds the whole course" scenario.
  /api/v1/agent/courses/{id}/activate:
    post:
      tags: [agent, courses]
      summary: Activate a course (review → active), same transition as owner approve.
      security: [{ bearerAuth-agent: [] }]
      responses:
        '200': { description: ok }
        '404': { description: not_found }
        '422': { description: invalid_transition }

  /api/v1/agent/courses/{id}/curriculum:
    put:
      tags: [agent, courses]
      summary: Replace the course's curriculum (atomic).
      security: [{ bearerAuth-agent: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modules]
              properties:
                modules:
                  type: array
                  items:
                    type: object
                    properties:
                      title: { type: string }
                      position: { type: integer }
                      lessons:
                        type: array
                        items:
                          type: object
                          properties:
                            title: { type: string }
                            position: { type: integer }
      responses: { '200': { description: ok } }

  # Phase 27.6: tutor adds a single quiz to an existing lesson
  # without re-submitting the whole curriculum (closes Phase 18.6).
  /api/v1/agent/lessons/{id}/quizzes:
    post:
      tags: [agent, courses]
      summary: Append a quiz to a lesson (agent-side). Position 0 = append at end.
      security: [{ bearerAuth-agent: [] }]
      responses:
        '201': { description: created }

  # Phase 31.5: planner writes a study proposal that the user can
  # accept or dismiss from the Dashboard tray. created_by_agent is
  # stamped from the bearer token, never from the body.
  /api/v1/agent/study-proposals:
    post:
      tags: [agent, study]
      summary: File a pending study proposal.
      security: [{ bearerAuth-agent: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, target_date]
              properties:
                course_id:   { type: string, description: optional course link }
                title:       { type: string }
                body_md:     { type: string }
                target_date: { type: string, description: 'YYYY-MM-DD' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyProposalFull' }
        '400': { description: missing_title_or_target_date | invalid_json | invalid_input }
        '401': { description: missing agent identity }
        '503': { description: study service not wired }

  # Phase 31.5: narrow PATCH for pace_notes_md. Title/status/etc.
  # are owned by the human; only pace notes are agent-editable.
  /api/v1/agent/courses/{id}:
    patch:
      tags: [agent, courses, study]
      summary: Update course pace notes (PaceNotesMD).
      security: [{ bearerAuth-agent: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pace_notes_md: { type: string, description: 'free-form markdown; ≤ 64 KiB' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '400': { description: invalid_pace_notes_md }
        '404': { description: course not found }
        '400': { description: invalid_input }

  # Phase 31.6: user-side study proposal surface. The Dashboard
  # tray renders the pending list; accept/dismiss land here.
  /api/v1/study-proposals:
    get:
      tags: [study]
      summary: List pending study proposals (the Dashboard tray).
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items: { $ref: '#/components/schemas/StudyProposalView' }
        '503': { description: study service not wired }
  /api/v1/study-proposals/{id}/accept:
    post:
      tags: [study]
      summary: Accept a study proposal (materialise an inbox task).
      description: |
        201 on a fresh materialisation; 200 on an idempotent
        re-accept of an already-accepted proposal (returns the
        original task id). 409 on accept of a dismissed proposal;
        404 on unknown id.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: ok (idempotent re-accept)
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:         { $ref: '#/components/schemas/StudyProposalFull' }
                  task:             { $ref: '#/components/schemas/Task' }
                  already_accepted: { type: boolean }
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:         { $ref: '#/components/schemas/StudyProposalFull' }
                  task:             { $ref: '#/components/schemas/Task' }
                  already_accepted: { type: boolean }
        '404': { description: proposal not found }
        '409': { description: proposal_resolved }
        '503': { description: study service not wired }
  /api/v1/study-proposals/{id}/dismiss:
    post:
      tags: [study]
      summary: Dismiss a study proposal.
      description: |
        200 on a fresh dismiss. 409 on dismiss of an already-
        accepted proposal; 404 on unknown id.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal: { $ref: '#/components/schemas/StudyProposalFull' }
        '404': { description: proposal not found }
        '409': { description: proposal_resolved }
        '503': { description: study service not wired }

  /api/v1/agent/lessons/{id}/materialize:
    post:
      tags: [agent, courses]
      summary: Materialize a lesson (Phase 27.4) — write content_md and link the exercise task.
      description: |
        The tutor writes the lesson body. The service flips the
        lesson from `locked` to `open` so the student can read
        it. Idempotent — re-running with the same content keeps
        the existing task_id and status.
      security: [{ bearerAuth-agent: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_md]
              properties:
                content_md: { type: string }
                task_id: { type: string }
      responses:
        '200': { description: ok }
        '400': { description: invalid_input }
        '404': { description: lesson not found }

  /api/v1/agent/lessons/{id}/content:
    put:
      tags: [agent, courses]
      summary: PUT alias of /materialize (Phase 27.4). Identical body and response.
      security: [{ bearerAuth-agent: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_md]
              properties:
                content_md: { type: string }
                task_id: { type: string }
      responses:
        '200': { description: ok }
        '400': { description: invalid_input }
        '404': { description: lesson not found }

  # Phase 30.13: agent-side mirrors of the granular structure ops —
  # same handlers, same progress-preserving semantics as the user
  # side; tutors can maintain a live course without the curriculum
  # swap (which resets lesson progress).
  /api/v1/agent/courses/{id}/modules:
    post:
      tags: [agent, courses]
      summary: Append a module to the course (agent-side, Phase 30.13).
      security: [{ bearerAuth-agent: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        '201': { description: created }
        '400': { description: invalid_input }
        '404': { description: not_found }
        '422': { description: invalid_transition (course done/archived) }

  /api/v1/agent/courses/{id}/structure:
    put:
      tags: [agent, courses]
      summary: Reorder modules/lessons, IDs-only, exact coverage (Phase 30.13).
      description: |
        Same contract as PUT /api/v1/courses/{id}/structure: every
        module and lesson of the course exactly once, positions
        rewritten 1..n, lessons may move across modules. Returns the
        refreshed course tree.
      security: [{ bearerAuth-agent: [] }]
      responses:
        '200': { description: ok (course tree) }
        '400': { description: invalid_input }
        '404': { description: not_found }
        '422': { description: invalid_transition (course done/archived) }

  /api/v1/agent/modules/{id}:
    patch:
      tags: [agent, courses]
      summary: Rename a module / edit description (agent-side, Phase 30.13).
      security: [{ bearerAuth-agent: [] }]
      responses:
        '200': { description: ok }
        '400': { description: invalid_input }
        '404': { description: not_found }
        '422': { description: invalid_transition }
    delete:
      tags: [agent, courses]
      summary: Delete a module; lessons and quizzes cascade.
      security: [{ bearerAuth-agent: [] }]
      responses:
        '204': { description: deleted }
        '404': { description: not_found }
        '422': { description: invalid_transition }

  /api/v1/agent/modules/{id}/lessons:
    post:
      tags: [agent, courses]
      summary: Append a lesson to the module; born locked (agent-side, Phase 30.13).
      security: [{ bearerAuth-agent: [] }]
      responses:
        '201': { description: created }
        '400': { description: invalid_input }
        '404': { description: not_found }
        '422': { description: invalid_transition }

  /api/v1/agent/lessons/{id}:
    patch:
      tags: [agent, courses]
      summary: Rename a lesson in place; status/content preserved (agent-side, Phase 30.13).
      security: [{ bearerAuth-agent: [] }]
      responses:
        '200': { description: ok }
        '400': { description: invalid_input }
        '404': { description: not_found }
        '422': { description: invalid_transition }
    delete:
      tags: [agent, courses]
      summary: Delete a lesson; quizzes cascade.
      security: [{ bearerAuth-agent: [] }]
      responses:
        '204': { description: deleted }
        '404': { description: not_found }
        '422': { description: invalid_transition }

  /api/v1/agent/quizzes/{qid}:
    patch:
      tags: [agent, courses]
      summary: Edit a quiz in place (agent-side, Phase 30.13). Empty kind = exact.
      security: [{ bearerAuth-agent: [] }]
      responses:
        '200': { description: ok }
        '400': { description: invalid_input }
        '404': { description: not_found }
        '422': { description: invalid_transition }
    delete:
      tags: [agent, courses]
      summary: Delete a quiz.
      security: [{ bearerAuth-agent: [] }]
      responses:
        '204': { description: deleted }
        '404': { description: not_found }
        '422': { description: invalid_transition }

  # Phase 29.1: agent wiki + search. Same handlers as the user side —
  # wiki_pages has no owner column, so the bearer token is the only
  # gate. PUT /{slug} is the upsert (create + update); no bare POST.
  /api/v1/agent/pages:
    get:
      tags: [agent, wiki]
      summary: List the wiki page tree (agent side).
      security: [{ bearerAuth-agent: [] }]
      responses: { '200': { description: ok } }

  /api/v1/agent/pages/{slug}:
    get:
      tags: [agent, wiki]
      summary: Get a wiki page by slug (agent side).
      security: [{ bearerAuth-agent: [] }]
      responses:
        '200': { description: ok }
        '404': { description: page not found }
    put:
      tags: [agent, wiki]
      summary: Upsert a wiki page (agent side). URL slug is authoritative.
      security: [{ bearerAuth-agent: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content_md: { type: string }
                parent_id: { type: string }
                position: { type: integer }
      responses:
        '200': { description: ok }
        '400': { description: invalid_input }
        '409': { description: slug_taken }
    delete:
      tags: [agent, wiki]
      summary: Delete a wiki page (agent side). Cascades wiki_links.
      security: [{ bearerAuth-agent: [] }]
      responses:
        '204': { description: deleted }
        '404': { description: page not found }

  /api/v1/agent/pages/{slug}/move:
    patch:
      tags: [agent, wiki]
      summary: Move a page under a new parent (agent side). Empty parent_id = root.
      security: [{ bearerAuth-agent: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id: { type: string }
      responses:
        '204': { description: moved }
        '400': { description: cycle or invalid parent }
        '404': { description: page not found }

  /api/v1/agent/pages/{slug}/backlinks:
    get:
      tags: [agent, wiki]
      summary: List pages that link to this one (agent side).
      security: [{ bearerAuth-agent: [] }]
      responses: { '200': { description: ok } }

  /api/v1/agent/search:
    get:
      tags: [agent, wiki]
      summary: FTS5 search across tasks/pages/comments (agent side).
      security: [{ bearerAuth-agent: [] }]
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses: { '200': { description: ok } }

  # ---- SPA fallback ----
  /{catchAll}:
    get:
      tags: [meta]
      summary: Single-page-app fallback (serves index.html).
      security: []
      responses:
        '200': { description: ok }
