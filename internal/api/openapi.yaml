# Orenda REST API — OpenAPI 3.1
#
# This file is the machine-readable contract for the Orenda API.
# The route-coverage test (`internal/api/openapi_coverage_test.go`)
# walks the live chi router and asserts every route appears here —
# so a forgotten endpoint fails CI instead of shipping undocumented.
#
# Path templating: chi's `{id}` style. We also accept path-style
# parameters like `/columns/{id}` and `/columns/{id}/tasks/{taskId}`.
#
# Auth: see Security Schemes below. Two scopes:
#   - bearerAuth-cookie: cookie-session login (UI flows)
#   - bearerAuth-agent:  opaque API token (agent flows)
#
# Conventions:
#   - 200/201 for happy-path reads/writes
#   - 204 for DELETE /.../{id} with no body
#   - 400 for invalid input (validation failed)
#   - 401 for missing/invalid auth
#   - 403 for wrong scope (cookie vs agent)
#   - 404 for unknown ids
#   - 409 for state conflicts (lock_taken, dependency exists)
#   - 422 for lifecycle violations (invalid transition, task_blocked)
#   - 429 for rate limit (Retry-After header)

openapi: 3.1.0
info:
  title: Orenda REST API
  version: 0.2.0-dev
  description: |
    Single-binary, local-first productivity suite (tasks, calendar, wiki)
    with AI-agents as first-class citizens. Single-owner; cookie session for
    UI flows, opaque API tokens for external agents.

    Two integration surfaces:
      - cookie auth (`/api/v1/*`): browser session via /api/v1/auth/login
      - bearer auth (`/api/v1/agent/*`): external agents

    Schema details live in the responses; this spec covers the
    happy-path shapes only. Field-level validation lives in the
    domain layer (see `internal/domain/*`).

servers:
  - url: http://localhost:2137
    description: Default local install

tags:
  - name: meta
    description: Health/info endpoints (no auth required).
  - name: auth
    description: Login/logout for the UI.
  - name: users
    description: Owner profile.
  - name: projects
    description: Projects, boards, columns.
  - name: tasks
    description: Tasks (kanban items), comments, attachments, blockers.
  - name: tags
    description: Global tag catalogue.
  - name: calendar
    description: Events + time entries.
  - name: inbox
    description: Phase 16: tasks without a project.
  - name: review-queue
    description: Phase 19: tasks awaiting human verdict.
  - name: today
    description: Phase 20: daily-driver dashboard.
  - name: courses
    description: Phase 18: LMS courses.
  - name: wiki
    description: Wiki pages + FTS5 search.
  - name: notifications
    description: In-app notifications + bot subscriptions.
  - name: sync
    description: Phase 8: offline sync.
  - name: backups
    description: Snapshot + restore + git push.
  - name: agents
    description: Owner-side agent CRUD (admin).
  - name: agent
    description: Bearer-token agent endpoints (self).
  - name: webhooks
    description: Bot callbacks (VK, etc).
  - name: stats
    description: Phase 24: observability.

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth-cookie:
      type: apiKey
      in: cookie
      name: orenda_session
      description: JWT session cookie set by POST /api/v1/auth/login
    bearerAuth-agent:
      type: http
      scheme: bearer
      description: Opaque API token from POST /api/v1/agents

  # ---------------------------------------------------------------------------
  # Schemas — typed bodies for the most-used endpoints. Full coverage would
  # be a separate repo-wide effort; this set covers the entry points
  # (auth, task CRUD, course CRUD, agent claim).
  # ---------------------------------------------------------------------------
  schemas:
    Task:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        title: { type: string }
        status:
          type: string
          description: Canonical status or a project-defined column machine key.
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assignee_type:
          type: string
          enum: [user, agent]
        assignee_id: { type: string }
        awaiting:
          type: string
          enum: [none, human, agent]
        due_at: { type: string, format: date-time }
        # Phase 31: study-reminder marker. Non-empty means "soft
        # reminder accepted from a study proposal"; the Today
        # screen reads this to apply the no-escalation policy
        # (missed day never turns red). Loose FK to courses.id —
        # ON DELETE SET NULL on the row, so a course deletion
        # clears the link but keeps the task.
        study_course_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Column:
      type: object
      properties:
        id: { type: string }
        board_id: { type: string }
        name: { type: string }
        position: { type: number }
        wip_limit: { type: integer, nullable: true }
        color: { type: string }
        status:
          type: string
          description: Lowercase machine key used as task.status for this column.

    CourseActivity:
      type: object
      description: One row of the course activity feed (Phase 32.5).
      properties:
        id: { type: string }
        course_id: { type: string }
        actor_type: { type: string, enum: [user, agent] }
        actor_id: { type: string }
        kind:
          type: string
          enum:
            - created
            - approved
            - activated
            - curriculum_swapped
            - lesson_added
            - lesson_removed
            - lesson_edited
            - quiz_added
            - quiz_removed
            - quiz_edited
            - module_added
            - module_removed
            - module_edited
            - status_changed
            - archived
        payload: { type: string }
        created_at: { type: string, format: date-time }

    Course:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        intent_md: { type: string }
        status:
          type: string
          enum: [draft, review, active, done, archived]
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        pace:
          type: string
          enum: [casual, regular, intensive]
        owner_id: { type: string }
        # Phase 31: free-form pace notes. Set by the agent-planner
        # through PATCH /api/v1/agent/courses/{id} and read by the
        # Dashboard tray / Today suggestions. Trimmed + capped at
        # 64 KiB by course.Course.Validate.
        pace_notes_md: { type: string }

    # Phase 31.5: progress sub-object attached to active courses
    # in the agent-side list. Lets the planner see how far the
    # student is and what lessons are still open.
    ActiveCourseProgress:
      type: object
      properties:
        lessons_total: { type: integer }
        lessons_done: { type: integer }
        open_lessons:
          type: array
          items: { $ref: '#/components/schemas/OpenLesson' }
        last_completed_at:
          type: string
          format: date-time
          nullable: true

    OpenLesson:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        module_id: { type: string }
        module_title: { type: string }
        position: { type: integer }

    # Phase 31.6: study proposal (lightweight Dashboard-tray shape).
    # Today/projects paths only need the tray fields; the full
    # entity lives in the agent namespace and the user accept/
    # dismiss response.
    StudyProposalView:
      type: object
      properties:
        id: { type: string }
        course_id: { type: string }
        title: { type: string }
        body_md: { type: string }
        target_date:
          type: string
          description: 'YYYY-MM-DD — the day the proposal suggests as a study slot'
        agent_id: { type: string }
        created_at: { type: string, format: date-time }

    # Phase 31.6: full proposal shape returned by accept/dismiss.
    # Same as StudyProposalView plus the resolved state and the
    # accepted_task_id pointer.
    StudyProposalFull:
      allOf:
        - $ref: '#/components/schemas/StudyProposalView'
        - type: object
          properties:
            status:
              type: string
              enum: [pending, accepted, dismissed]
            created_by_agent: { type: string }
            accepted_task_id: { type: string }
            resolved_at:
              type: string
              format: date-time
              nullable: true

    # Phase 31.7: payload returned by /today. Inline because the
    # frontend imports the same shape — keeping it as a named
    # schema lets openapi.yaml consumers (codegen, validators)
    # reference it instead of duplicating.
    TodayResponse:
      type: object
      properties:
        overdue:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        due_today:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        scheduled_today:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        upcoming_week:
          type: array
          items:
            type: object
            properties:
              date: { type: string, description: 'YYYY-MM-DD' }
              count: { type: integer }
        awaiting_count: { type: integer }
        active_timer:
          type: object
          nullable: true
          properties:
            task_id: { type: string }
            started_at: { type: string, format: date-time }
        proposals:
          type: array
          description: 'Phase 31.7: pending study proposals for the Dashboard tray. Empty array when none.'
          items: { $ref: '#/components/schemas/StudyProposalView' }


    Agent:
      type: object
      description: |
        Registered AI-agent client. Phase 28.19: `type` is a free-form
        label set (e.g. ["qwen"], ["qwen","installer"]) instead of a
        single string from a fixed enum. Empty arrays are valid and
        serialise as "[]". Labels are normalised on the server
        (trimmed, lowercased, deduped, sorted).
      properties:
        id: { type: string }
        name: { type: string }
        type:
          type: array
          items: { type: string }
        description: { type: string }
        token_id: { type: string }
        last_seen_at: { type: string, format: date-time }
        status:
          type: string
          enum: [online, offline, disabled]
        max_concurrent: { type: integer }
        created_at: { type: string, format: date-time }

    CreateAgentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type:
          type: array
          items: { type: string }
          description: Free-form labels (e.g. ["qwen","installer"]). Empty array is valid.
        description: { type: string }
        scopes:
          type: array
          items: { type: string }

    Error:
      type: object
      properties:
        error: { type: string }

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:

  # ---- meta ----
  /healthz:
    get:
      tags: [meta]
      summary: Liveness probe.
      responses:
        '200': { description: ok }

  /api/v1/info:
    get:
      tags: [meta]
      summary: Server version + capabilities.
      responses:
        '200': { description: ok }

  /api/v1/openapi.yaml:
    get:
      tags: [meta]
      summary: This OpenAPI document (machine-readable contract).
      responses:
        '200':
          description: yaml
          content:
            text/yaml:
              schema: { type: string }

  /api/v1/stats:
    get:
      tags: [stats]
      summary: 'Observability snapshot: uptime + request counters + ws + db size.'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptime_seconds: { type: integer }
                  requests_total: { type: integer }
                  requests_2xx: { type: integer }
                  requests_3xx: { type: integer }
                  requests_4xx: { type: integer }
                  requests_5xx: { type: integer }
                  slow_requests: { type: integer }
                  ws_connections: { type: integer }
                  db_bytes: { type: integer }
                  db_path: { type: string }
                  sync_ops_record_failures: { type: integer, description: 'Phase 30.2: count of sync_ops.Record() failures since process start. Non-zero indicates outbox idempotency table is unhealthy and the client may replay ops.' }

  # ---- auth ----
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Email + password → JWT cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: ok, sets session cookie }
        '401': { description: invalid credentials }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Clear session cookie.
      responses:
        '200': { description: ok }

  /api/v1/webhooks/vk:
    post:
      tags: [webhooks]
      summary: VK Community Bot callback.
      responses:
        '200': { description: ok }

  # ---- users ----
  /api/v1/me:
    get:
      tags: [users]
      summary: Current user profile.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }

  # ---- projects ----
  /api/v1/projects:
    get:
      tags: [projects]
      summary: List projects owned by the current user.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    post:
      tags: [projects]
      summary: Create a project (auto-creates default board + 5 columns).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '201': { description: created } }

  /api/v1/projects/{id}:
    get:
      tags: [projects]
      summary: Get a project.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '404': { description: not found }
    patch:
      tags: [projects]
      summary: Update project fields (name/color/description/archived).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '404': { description: not found }
    delete:
      tags: [projects]
      summary: Delete project (cascades to boards/columns/tasks).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '204': { description: deleted }
        '404': { description: not found }

  /api/v1/projects/{id}/board:
    get:
      tags: [projects]
      summary: Board + columns for a project (no tasks).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/projects/{id}/activity:
    get:
      tags: [projects]
      summary: Audit log aggregated across the project's tasks.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/projects/{id}/attachments:
    get:
      tags: [projects]
      summary: List every attachment in the project.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    post:
      tags: [projects]
      summary: Upload a project-level attachment (multipart).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '201': { description: created } }

  /api/v1/projects/{id}/columns:
    post:
      tags: [projects]
      summary: Append a column to the project's board.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                color: { type: string }
                wip_limit: { type: integer, minimum: 0, nullable: true }
                status: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
      responses: { '201': { description: created } }

  /api/v1/projects/{id}/tasks:
    get:
      tags: [projects, tasks]
      summary: List tasks in a project (Phase 17: enriched with counters + blocked_by_count).
      security: [{ bearerAuth-cookie: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: column_id
          schema: { type: string }
      responses: { '200': { description: ok } }
    post:
      tags: [projects, tasks]
      summary: Create a task in a project.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                status: { $ref: '#/components/schemas/Task/properties/status' }
                priority: { $ref: '#/components/schemas/Task/properties/priority' }
                parent_task_id: { type: string }
                assignee_type: { type: string }
                assignee_id: { type: string }
                due_at: { type: string, format: date-time }
      responses:
        '201': { description: created }
        '400': { description: invalid input }

  /api/v1/columns/{id}:
    patch:
      tags: [projects]
      summary: Update a column (name/position/wip_limit/color/status).
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                position: { type: number }
                wip_limit: { type: integer, minimum: 0, nullable: true }
                color: { type: string }
                status: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
      responses:
        '200': { description: ok }
        '400': { description: invalid status or input }
        '409': { description: duplicate status on this board }
        '422': { description: wip_limit_too_small }
    delete:
      tags: [projects]
      summary: Delete a column (only when empty).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '204': { description: deleted }
        '422': { description: column_not_empty }

  # ---- tasks ----
  /api/v1/tasks/bulk-edit:
    post:
      tags: [tasks]
      summary: Apply one partial task patch to several tasks.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_ids, patch]
              properties:
                task_ids:
                  type: array
                  minItems: 1
                  items: { type: string }
                patch:
                  type: object
                  properties:
                    status: { type: string }
                    priority: { type: string, enum: [low, medium, high, urgent] }
                    assignee_type: { type: string }
                    assignee_id: { type: string }
                    completed_at: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Updated tasks and per-task errors (if any).
        '400': { description: invalid request }
  /api/v1/tasks/with-due:
    get:
      tags: [tasks]
      summary: 'Phase 30.8: tasks with a due_at in [from, to]. Used by the calendar to render deadlines alongside timed events.'
      security: [{ bearerAuth-cookie: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { description: ok }
        '400': { description: invalid_from / invalid_to }
  /api/v1/tasks/{id}:
    get:
      tags: [tasks]
      summary: Get a single task.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '404': { description: not found }
    patch:
      tags: [tasks]
      summary: Update task fields.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    put:
      tags: [tasks]
      summary: Alias for PATCH (update task fields).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    delete:
      tags: [tasks]
      summary: Delete a task.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '204': { description: deleted }

  /api/v1/tasks/{id}/move:
    post:
      tags: [tasks]
      summary: Move a task to a different column.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '422': { description: wip_limit_exceeded }

  /api/v1/tasks/{id}/claim:
    post:
      tags: [tasks]
      summary: Claim a task for an agent (user-side; agent-side has the bearer equivalent).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '409':
          description: lock_taken — Phase 15: the response now includes holder_agent_id, holder_agent_name, and claimed_at so the agent can see who's holding the lock and ask them.

  /api/v1/tasks/{id}/release:
    post:
      tags: [tasks]
      summary: Release a claim.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/tasks/{id}/submit:
    post:
      tags: [tasks]
      summary: Mark a task ready for review (status=review, awaiting=human).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/tasks/{id}/review:
    post:
      tags: [tasks]
      summary: Accept or return a task in review.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                comment: { type: string }
      responses: { '200': { description: ok } }

  /api/v1/tasks/{id}/children:
    get:
      tags: [tasks]
      summary: List direct child tasks + progress.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/tasks/{id}/blockers:
    get:
      tags: [tasks]
      summary: List every blocker (open + satisfied).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/tasks/{id}/dependents:
    get:
      tags: [tasks]
      summary: List tasks depending on this task (reverse lookup).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/tasks/{id}/dependencies:
    put:
      tags: [tasks]
      summary: Replace the full blocker set.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [depends_on_ids]
              properties:
                depends_on_ids:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: ok }
        '422': { description: invalid_dependency (cycle or self-loop) }

  /api/v1/tasks/{id}/tags:
    get:
      tags: [tasks, tags]
      summary: List tags attached to the task.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    put:
      tags: [tasks, tags]
      summary: Replace the task's tag set.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/tasks/{id}/checklists:
    get:
      tags: [tasks]
      summary: List checklists + items.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    post:
      tags: [tasks]
      summary: Add a checklist.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '201': { description: created } }

  /api/v1/tasks/{id}/checklists/{clId}:
    delete:
      tags: [tasks]
      summary: Delete a checklist (cascade items).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '204': { description: deleted } }

  /api/v1/tasks/{id}/checklists/{clId}/items:
    get:
      tags: [tasks]
      summary: List items in a checklist.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    post:
      tags: [tasks]
      summary: Add an item to a checklist.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '201': { description: created } }

  /api/v1/tasks/{id}/checklists/{clId}/items/{itemId}:
    patch:
      tags: [tasks]
      summary: Update an item (done/title).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    delete:
      tags: [tasks]
      summary: Delete an item.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '204': { description: deleted } }

  /api/v1/tasks/{id}/comments:
    get:
      tags: [tasks]
      summary: List comments on a task.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    post:
      tags: [tasks]
      summary: Add a comment (markdown; @user:&lt;id&gt; mentions).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '201': { description: created } }

  /api/v1/tasks/{id}/attachments:
    get:
      tags: [tasks]
      summary: List attachments on a task.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    post:
      tags: [tasks]
      summary: Upload a task attachment (multipart).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '201': { description: created } }

  /api/v1/tasks/{id}/attachments/{attId}/download:
    get:
      tags: [tasks]
      summary: Stream an attachment file.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '404': { description: not found }

  /api/v1/tasks/{id}/activity:
    get:
      tags: [tasks]
      summary: Audit log for the task.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/tasks/{id}/context:
    get:
      tags: [tasks]
      summary: Full snapshot: task + comments + activity + children + checklists.
      description: |
        Phase 15: response now also carries `blocked_by` (open
        dependency ids) and `lock_holder` (agent_id / agent_name /
        acquired_at) when applicable. Both fields are omitted when
        no blockers are open / no lock is currently held. Same
        helpers power the bearer-agent `/agent/tasks/{id}/context`.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/tasks/{id}/timer/start:
    post:
      tags: [tasks, calendar]
      summary: Start a timer for the task.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '409': { description: already_open }

  /api/v1/tasks/{id}/timer/stop:
    post:
      tags: [tasks, calendar]
      summary: Stop the active timer for the task.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/tasks/{id}/time:
    post:
      tags: [tasks, calendar]
      summary: Add a manual time entry.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '201': { description: created } }

  # ---- tags ----
  /api/v1/tags:
    get:
      tags: [tags]
      summary: List global tag catalogue.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    post:
      tags: [tags]
      summary: Create a tag.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '201': { description: created } }

  /api/v1/tags/{id}:
    patch:
      tags: [tags]
      summary: Update a tag (rename / recolour).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    delete:
      tags: [tags]
      summary: Delete a tag (cascades to task_tags).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '204': { description: deleted } }

  # ---- calendar ----
  /api/v1/events:
    get:
      tags: [calendar]
      summary: List events in [from, to).
      security: [{ bearerAuth-cookie: [] }]
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: project_id
          schema: { type: string }
      responses: { '200': { description: ok } }
    post:
      tags: [calendar]
      summary: Create an event (supports RFC 5545 RRULE).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '201': { description: created } }

  /api/v1/events/{id}:
    get:
      tags: [calendar]
      summary: Get an event.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    patch:
      tags: [calendar]
      summary: Update an event.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }
    delete:
      tags: [calendar]
      summary: Delete an event.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '204': { description: deleted } }

  /api/v1/attachments/{attId}/download:
    get:
      tags: [attachments]
      summary: Stream an attachment by id (any target type).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '404': { description: not found }

  /api/v1/events/await:
    post:
      tags: [calendar]
      summary: Long-poll for the next event.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200': { description: ok }
        '204': { description: timeout }

  # ---- agents (admin, owner-side) ----
  /api/v1/agents:
    get:
      tags: [agents]
      summary: List registered agents, optionally filtered by label.
      description: |
        Phase 28.19: the repeatable `type` query parameter filters by
        label set. The semantics are OR — an agent matches when at
        least one of its labels appears in the filter set. Filters are
        case-insensitive. With no `type` parameter every agent is
        returned.
      security: [{ bearerAuth-cookie: [] }]
      parameters:
        - in: query
          name: type
          required: false
          schema: { type: string }
          description: |
            Repeatable. Label to filter by. Example:
            `?type=qwen&type=installer` returns agents that carry
            either label.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/Agent' }
    post:
      tags: [agents]
      summary: Register a new agent; returns the opaque token once.
      description: |
        Phase 28.19: `type` is now a free-form label set; old payloads
        with a single string `"type": "qwen"` are rejected with 400.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentRequest' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: '#/components/schemas/Agent' }
                  plain_token: { type: string }

  /api/v1/agents/{id}:
    get:
      tags: [agents]
      summary: Get an agent.
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
    delete:
      tags: [agents]
      summary: Disable an agent (revokes the token).
      security: [{ bearerAuth-cookie: [] }]
      responses: { '204': { description: deleted } }

  /api/v1/agents/{id}/heartbeat:
    post:
      tags: [agents]
      summary: Refresh last_seen_at (owner-side, no token check).
      security: [{ bearerAuth-cookie: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }

  # ---- inbox ----
  /api/v1/inbox/tasks:
    get:
      tags: [inbox]
      summary: List tasks with project_id IS NULL (Phase 16 inbox).
      security: [{ bearerAuth-cookie: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses: { '200': { description: ok } }
    post:
      tags: [inbox]
      summary: Create an inbox task.
      security: [{ bearerAuth-cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
      responses: { '201': { description: created } }

  # ---- review-queue ----
  /api/v1/review-queue:
    get:
      tags: [review-queue]
      summary: List tasks awaiting human action.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  /api/v1/review-queue/count:
    get:
      tags: [review-queue]
      summary: Cheap count for the sidebar badge.
      security: [{ bearerAuth-cookie: [] }]
      responses: { '200': { description: ok } }

  # ---- today ----
  /api/v1/today:
    get:
      tags: [today]
      summary: Daily-driver dashboard payload (overdue + due-today + scheduled + awaiting + study proposals).
      security: [{ bearerAuth-cookie: [] }]
