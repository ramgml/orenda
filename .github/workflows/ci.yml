# CI pipeline for Orenda.
#
# Phase 32.6 (ci-local-gates-hooks): per-PR gates moved to local git hooks
# (`make hooks` → core.hooksPath = scripts/git-hooks/). GitHub Actions now
# runs only:
#   - the RELEASE GATE on PR/push to main and on tags v*
#   - a TEST-only backstop on push to dev (catches `--no-verify` escapes)
#   - PRs to dev are intentionally silent — agent reviews locally and
#     submits via `orenda agent submit`, then claims the next task without
#     waiting on this runner
#   - `workflow_dispatch` runs the full pipeline on demand
#
# Jobs (release gate only — push-to-dev backstop runs only `test-full`):
#   lint     — golangci-lint (new-vs-main on release-gate runs; full lint
#              stays local as `make lint` debt inventory, Phase 30.16)
#   test     — go test -race + vitest
#   build    — make build (binary with embedded SPA)
#   e2e      — Playwright against the built binary
#
# Concurrency: cancel previous runs on the same branch/ref to save CI minutes
# when a PR gets force-pushed or amended.
#
# Pre-existing lint debt (≈71 issues on dev) is gated locally by `make lint-new`
# (--new-from-merge-base=origin/dev) — not blocked here. See Phase 30.16.
name: ci

on:
  # PR into dev: NO CI — local hooks are the gate (wiki:ci-local-gates-hooks).
  pull_request:
    branches: [main]
  # Push into dev: only the test backstop (lint/build/e2e are skipped).
  # Push into main: full release gate.
  # Tags v*: full release gate.
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Make `make` available; the repo's Makefile drives the build.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (Go + Web)
    # Release gate only: push to main, PR to main, tags v*, manual dispatch.
    # `push` event with branch == dev is the test-only backstop — lint is
    # skipped so a regression in the local hooks cannot wedge a no-wait dev
    # run (agents don't wait on this; lint gate is `make lint-new` locally).
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # golangci-lint runs full on the release branch — needs the
          # merge-base commit in the local history.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install golangci-lint
        # Build from source with the local Go toolchain — the published
        # v1.64.x binaries were built with go1.24 and refuse to load
        # .golangci.yml against go.mod's `go 1.26.4` directive. Slower
        # than the action's prebuilt cache, but always matches the
        # project's Go version. When v2 stabilises and we migrate the
        # config, switch back to golangci/golangci-lint-action@v6 with
        # `version: v2.x.y`.
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.6

      - name: golangci-lint run (new vs main)
        # Release gate — incremental against origin/main, mirroring the
        # local `make lint-new` contract (wiki:ci-local-gates-hooks).
        # The previous full-lint-on-release-branch step never passed:
        # both v0.2.0 pushes to main ran red on the Phase 30.16
        # pre-existing debt (≈71 issues, tolerated on dev by decision).
        # A permanently-red gate is not a gate — what a release ADDS
        # must be clean; the debt closes opportunistically via 30.16.
        run: |
          git fetch --no-tags origin main
          "$(go env GOPATH)/bin/golangci-lint" run --new-from-merge-base=origin/main ./...

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: eslint
        working-directory: web
        run: npm run lint

      - name: prettier --check
        working-directory: web
        run: npm run format:check

  test:
    name: Test (Go + vitest)
    # Runs everywhere except PR-to-dev (PR to dev is intentionally silent
    # per wiki:ci-local-gates-hooks — push-to-dev backstop fires only `test`,
    # so PR-to-dev is the "nothing happens" case).
    # always(): on push-to-dev `lint` is skipped, and a skipped `needs` would
    # otherwise propagate the skip to this job regardless of its own `if`.
    # failure/cancelled of lint still blocks the run (release-gate semantics).
    if: >-
      always()
      && needs.lint.result != 'failure'
      && needs.lint.result != 'cancelled'
      && (
        github.event_name == 'workflow_dispatch'
        || github.event_name == 'push'
        || (github.event_name == 'pull_request' && github.base_ref == 'main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: "make test-full (full uncached run: go test -race -count=1 + vitest)"
        # The CI backstop deliberately runs the full `make test-full` target
        # (-count=1 disables the Go test cache) — single source of truth
        # for the from-scratch suite. The local pre-push hook uses the
        # cached `make test` instead (wiki:ci-local-gates-hooks).
        run: make test-full

  build:
    name: Build (binary with embedded SPA)
    # Release gate only — same conditions as lint.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - name: Checkout
        with:
          # Build step needs git tags for `make build` → VERSION=$(git describe).
          fetch-depth: 0
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: make build
        run: make build

      - name: Verify binary
        run: |
          test -x bin/orenda
          file bin/orenda
          ./bin/orenda version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: orenda-bin
          path: bin/orenda
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: E2E (Playwright)
    # Release gate only — same conditions as lint/build.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: orenda-bin
          path: bin

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: make test-e2e
        run: make test-e2e
        env:
          # Don't let CI accidentally talk to the developer's local instance.
          ORENDA_SERVER__PORT: '21371'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore