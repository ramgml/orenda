# CI pipeline for Orenda.
#
# Phase 32.6 (ci-local-gates-hooks): per-PR gates moved to local git hooks
# (`make hooks` → core.hooksPath = scripts/git-hooks/). GitHub Actions now
# runs only:
#   - the RELEASE GATE on PR/push to main and on tags v*
#   - a TEST-only backstop on push to dev (catches `--no-verify` escapes)
#   - PRs to dev are intentionally silent — agent reviews locally and
#     submits via `orenda agent submit`, then claims the next task without
#     waiting on this runner
#   - `workflow_dispatch` runs the full pipeline on demand
#
# Jobs (release gate only — push-to-dev backstop runs `web-typecheck` + `test-full`):
#   lint     — golangci-lint (new-vs-main on release-gate runs; full lint
#              stays local as `make lint` debt inventory, Phase 30.16)
#   test     — web-typecheck + go test -race + vitest
#   build    — make build (binary with embedded SPA)
#   e2e      — Playwright against the built binary
#
# Concurrency: cancel previous runs on the same branch/ref to save CI minutes
# when a PR gets force-pushed or amended.
#
# Pre-existing lint debt (≈71 issues on dev) is gated locally by `make lint-new`
# (--new-from-rev, base ref origin/dev) — not blocked here. See Phase 30.16.
name: ci

on:
  # PR into dev: NO CI — local hooks are the gate (wiki:ci-local-gates-hooks).
  pull_request:
    branches: [main]
  # Push into dev: only the test backstop (lint/build/e2e are skipped).
  # Push into main: full release gate.
  # Tags v*: full release gate.
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Make `make` available; the repo's Makefile drives the build.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (Go + Web)
    # Release gate only: push to main, PR to main, tags v*, manual dispatch.
    # `push` event with branch == dev is the test-only backstop — lint is
    # skipped so a regression in the local hooks cannot wedge a no-wait dev
    # run (agents don't wait on this; lint gate is `make lint-new` locally).
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # golangci-lint runs incremental vs origin/main — needs the
          # base commit in the local history.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install golangci-lint
        # Build from source with the local Go toolchain (v2 module path).
        # v2.13.x matches `.golangci.yml` schema `version: "2"` and the
        # local gates (`make lint`/`lint-new`, Task 183). The published
        # prebuilt binaries can lag the project's Go version, so building
        # via `go install` always matches the setup-go toolchain.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: golangci-lint run (new vs main)
        # Release gate — incremental against origin/main. golangci-lint v2
        # removed --new-from-merge-base; resolve the merge-base ref to a SHA
        # ourselves with --new-from-rev, mirroring `make lint-new` (Task 187).
        run: |
          git fetch --no-tags origin main
          "$(go env GOPATH)/bin/golangci-lint" run --new-from-rev="$(git rev-parse origin/main)" ./...

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: eslint
        working-directory: web
        run: npm run lint

      - name: prettier --check
        working-directory: web
        run: npm run format:check

  test:
    name: Test (Go + vitest)
    # Runs everywhere except PR-to-dev (PR to dev is intentionally silent
    # per wiki:ci-local-gates-hooks — push-to-dev backstop fires only `test`,
    # so PR-to-dev is the "nothing happens" case).
    # always(): on push-to-dev `lint` is skipped, and a skipped `needs` would
    # otherwise propagate the skip to this job regardless of its own `if`.
    # failure/cancelled of lint still blocks the run (release-gate semantics).
    if: >-
      always()
      && needs.lint.result != 'failure'
      && needs.lint.result != 'cancelled'
      && (
        github.event_name == 'workflow_dispatch'
        || github.event_name == 'push'
        || (github.event_name == 'pull_request' && github.base_ref == 'main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: "make web-typecheck (tsc --noEmit — catch TS errors before build)"
        # Task 44: the dev backstop catches the incident class where tsc
        # errors broke web-build (shadcn.test.tsx, v0.5.0 blocker). Runs
        # before test-full so the failure message is clear and isolated.
        run: make web-typecheck

      - name: "make test-full (full uncached run: go test -race -count=1 + vitest)"
        # The CI backstop deliberately runs the full `make test-full` target
        # (-count=1 disables the Go test cache) — single source of truth
        # for the from-scratch suite. The local pre-push hook uses the
        # cached `make test` instead (wiki:ci-local-gates-hooks).
        run: make test-full

  build:
    name: Build (binary with embedded SPA)
    # Release gate only — same conditions as lint.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - name: Checkout
        with:
          # Build step needs git tags for `make build` → VERSION=$(git describe).
          fetch-depth: 0
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: make build
        run: make build

      - name: Verify binary
        run: |
          test -x bin/orenda
          file bin/orenda
          ./bin/orenda version

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: orenda-bin
          path: bin/orenda
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: E2E (Playwright)
    # Release gate only — same conditions as lint/build.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    # Browsers + system deps preinstalled; bump вместе с @playwright/test в web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: orenda-bin
          path: bin

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: make test-e2e
        # Образ playwright не содержит make; make test-e2e = (build) + эта строка,
        # а binary уже скачан артефактом и используется e2e-setup/run-server.sh.
        # chmod нужен: upload-artifact не хранит exec-бит (раньше это маскировал
        # rebuild в make build).
        run: chmod +x bin/orenda && cd web && npx playwright test
        env:
          # Don't let CI accidentally talk to the developer's local instance.
          ORENDA_SERVER__PORT: '21371'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    # Task 346: a `vX.Y.Z` tag push now PUBLISHES the GitHub Release object
    # automatically — until now releases were created by hand (v0.17–v0.21)
    # and the practice silently lapsed (v0.22.0–v0.23.1 had tags but no
    # release pages until the 2026-09-20 catch-up). Notes are cut from the
    # matching `## [X.Y.Z]` section of CHANGELOG.md — the same canonical
    # text the release branch just shipped.
    # The tag CI has already run the full gate (lint/test/build/e2e above);
    # this job only publishes, so it must never run on a red gate.
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && !cancelled()
      && needs.lint.result == 'success'
      && needs.test.result == 'success'
      && needs.build.result == 'success'
      && needs.e2e.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, build, e2e]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract changelog section for the tag
        # Tag "v0.24.0" → heading "## [0.24.0]"; grab everything up to the
        # next "## [" heading. An empty cut means the release branch forgot
        # the changelog entry — fail loudly instead of publishing junk.
        # Literal index() prefix matches, not a regex: awk -v processes
        # escape sequences a second time, so -v pat="^## \\[$VER\\]" once
        # degraded into a bare character class and never matched (first
        # real run of this job, tag v0.24.0, run 35698912903).
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [$VER]" '
            index($0, hdr) == 1 {found=1; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::No CHANGELOG.md section '## [$VER]' found (or section is empty) — release notes would be blank."
            exit 1
          fi
          echo "--- notes preview (first 10 lines) ---"
          head -10 /tmp/notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — updating notes instead."
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Orenda $GITHUB_REF_NAME" --notes-file /tmp/notes.md --latest
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Orenda $GITHUB_REF_NAME" --notes-file /tmp/notes.md --latest