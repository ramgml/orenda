# golangci-lint v2 configuration for Orenda (tooling/lint-complexity-deadcode).
#
# Docs: https://golangci-lint.run/docs/configuration/file/
# Migrated from v1 format + extended with complexity / dead-code linters.
#
# Keep this file conservative: linters should catch real bugs and real
# debt, not bikeshed style. Style is enforced by gofmt + goimports.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # ---- correctness / hygiene (as before the migration) ----
    - errcheck       # unchecked errors in defer/file ops
    - govet          # suspicious constructs
    - ineffassign    # unused assignments
    - staticcheck    # the canonical "things you forgot" (absorbs gosimple+stylecheck in v2)
    - unused         # unused unexported identifiers
    - gocritic       # opinionated style + perf
    - misspell       # typos in comments
    - bodyclose      # http.Response.Body.Close
    - contextcheck   # ctx propagation
    - nilerr         # `return nil` after err check
    - nilnil         # `return nil, nil` warning
    - prealloc       # slice pre-allocation hints
    - revive         # golint successor
    - unconvert      # redundant conversions
    - unparam        # unused function params

    # ---- complexity (new) ----
    - gocyclo        # cyclomatic complexity per function
    - gocognit       # cognitive complexity per function (explicit threshold T191; was implicit default)
    # ---- dead code ----
    # `unused` (above) is Go's dead-code workhorse; unreachable code is
    # covered by govet/revive/staticcheck. Exported-but-dead API in the
    # SPA is covered by knip (see web/knip.json + make web-knip).
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - ifElseChain       # noisy
        - tooManyResultsChecker
        # hugeParam is an opinionated style recommendation, not a correctness
        # bug. Phase 28.15 already converted internal/api handler factories to
        # pass Dependencies by pointer; for the remaining service / bot /
        # storage / cmd code we deliberately keep value semantics — the
        # structs are small enough that copy cost is below noise, and the
        # API surface (function signatures) stays explicit.
        - hugeParam
    revive:
      rules:
        - name: package-comments
        - name: exported
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: error-naming
        - name: import-shadowing
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
    # Complexity thresholds — explicit since T191 (post-T179 debt cleanup).
    # Tightening gocognit to 25 was evaluated at T191: 8 findings across
    # legacy handlers/wiki/mcp/ws code at 25, so 30 is fixed here and the
    # tightening is deferred (see decision log, 2026-09-09).
    funlen:
      lines: 120          # a function that scrolls is a design smell
      statements: 80
    nestif:
      min-complexity: 6
    gocyclo:
      min-complexity: 20
    gocognit:
      min-complexity: 30
  exclusions:
    # node_modules ships third-party Go files (e.g. flatted's wasm helper)
    # that `./...` would otherwise scan; they are npm deps, not our code.
    paths:
      - web/node_modules
    rules:
      # Tests can use package-level helpers liberally, and complexity
      # linters on table-driven tests just punish thoroughness.
      - path: _test\.go
        linters:
          - gocritic
          - revive
          - gocyclo
          - gocognit
          - funlen
          - nestif

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/ramgml/orenda]

# issues.* defaults are fine in v2: no cap on reported issues.
