# Orenda configuration example.
#
# Tracked in git at configs/config.example.yaml (moved out of data/ in
# Phase 28.21 — gitignore negations cannot re-include files under an
# excluded directory, so the old data/config.example.yaml silently never
# shipped to fresh clones and install.sh crashed mid-install).
#
# install.sh copies this to $DATA_DIR/config.yaml and rewrites the
# data/ paths to absolute ones. For a manual setup:
#   cp configs/config.example.yaml data/config.yaml
#   export ORENDA_AUTH__JWT_SECRET=$(head -c32 /dev/urandom | base64)
#   # or, keeping the secret out of /proc/*/environ (Task 138):
#   #   printf '%s' "$(head -c32 /dev/urandom | base64)" > ~/.local/share/orenda/credentials/jwt
#   #   export ORENDA_AUTH__JWT_SECRET_FILE=$HOME/.local/share/orenda/credentials/jwt

server:
  host: "127.0.0.1"     # loopback only by default
  port: 2137            # usage/dogfood port; `make dev` uses 2138 (Phase 28.20)
  read_timeout: "30s"
  write_timeout: "30s"
  shutdown_timeout: "10s"

storage:
  data_dir: "data"
  db_path: "data/orenda.db"
  wal_mode: true
  busy_timeout_ms: 5000

auth:
  # NEVER commit a real secret here. Leave empty and provide it via the
  # ORENDA_AUTH__JWT_SECRET environment variable; scripts/install.sh
  # generates a random one into $DATA_DIR/env on first install.
  jwt_secret: ""
  # Task 138: path to a file holding the JWT secret. Used only when
  # jwt_secret / ORENDA_AUTH__JWT_SECRET is empty — the direct value
  # wins. This setting holds the file PATH (not the secret), so the
  # secret itself never appears in /proc/*/environ. install.sh points
  # fresh installs at $DATA_DIR/credentials/jwt (file mode 600, dir 700).
  jwt_secret_file: ""
  jwt_ttl: "24h"                        # OWASP guidance for cookie sessions (Phase 28.4)
  cookie_name: "orenda_session"
  cookie_secure: false                  # set true behind a TLS reverse proxy
  bcrypt_cost: 12

logging:
  level: "info"        # debug | info | warn | error
  format: "json"       # json | console
  path: "data/logs/orenda.log"

backup:
  enabled: true
  # Git remote — configure via UI Settings → Backups after first run
  remote_url: ""
  remote_auth: ""      # token or ssh key path
  mirror_dir: "data/mirror"
  snapshot_dir: "data/snapshots"
  snapshot_rotation_days: 30
  git_push_interval: "5m"
  # Phase 32.7: 5-field cron expression (UTC). Drives the
  # snapshot fire loop in the scheduler. The same field is
  # editable from /settings/backups and hot-reloaded without
  # a restart; the YAML value is the cold-start default when
  # the operator hasn't saved one in the UI yet. Operators in
  # non-UTC time zones convert by hand (UTC math, DST-neutral
  # by construction — see docs/PLAN.md Phase 32.7).
  sqlite_snapshot_cron: "0 3 * * *"
  # Phase 32.8: renamed the log type from "wal_archive" to
  # "wal_checkpoint" — the underlying code is a SQLite WAL
  # truncation, NOT an off-host WAL archive. The YAML key stays
  # `wal_archive_interval` for back-compat with existing config
  # files. See wiki:decision-log "WAL archive vs WAL checkpoint".
  wal_archive_interval: "15m"

# Token-bucket rate limits (Phase 28.8). Anonymous = per IP (covers
# /api/v1/auth/login brute-force protection), authenticated = per
# user/agent identity.
ratelimit:
  anon_burst: 60
  anon_per_sec: 20
  auth_burst: 300
  auth_per_sec: 100

bots: []               # Phase 10 — pluggable bots

uploads:
  dir: "data/uploads"
  max_size_mb: 50
  allowed_mimes:
    - "image/*"
    - "application/pdf"
    - "text/*"
    - "application/json"
    - "application/markdown"
